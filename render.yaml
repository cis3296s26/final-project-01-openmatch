services:
  - type: web
    name: openmatch-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: openmatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: openmatch-redis
          property: connectionString

  - type: web
    name: openmatch-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://openmatch-backend.onrender.com

databases:
  - name: openmatch-db
    plan: free

keyvalue:
  - name: openmatch-redis
    plan: free